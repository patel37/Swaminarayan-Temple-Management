<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Payment Failed</title>
    <style>
      /* Add your styles here */
      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background-image: linear-gradient(to bottom, #f2f2f2, #ffffff);
      }
      .wave-container {
        position: relative;
        overflow: hidden;
        width: 100%;
        height: 100px;
      }
      .wave {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 100px;
        background: linear-gradient(to bottom, #f2f2f2, #ffffff);
        transform: translate3d(0, 0, 0);
        animation: wave-animation 20s cubic-bezier(0.36, 0.45, 0.63, 0.53) infinite;
      }
      @keyframes wave-animation {
        0% {
          transform: translate3d(-100%, 0, 0);
        }
        100% {
          transform: translate3d(100%, 0, 0);
        }
      }
      .fail-icon {
        font-size: 72px;
        color: red;
        margin-top: 30px;
      }
      .message {
        font-size: 24px;
        margin-top: 20px;
        text-align: center;
      }
      .description {
        font-size: 18px;
        margin-top: 20px;
        text-align: center;
        color: gray;
      }
      @media (max-width: 600px) {
        .message {
          font-size: 18px;
        }
        .description {
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="wave-container">
        <div class="wave"></div>
      </div>
      <i class="fail-icon">❌</i>
      <p class="message">Payment Failed</p>
      <p class="description">We're sorry, but there was a problem processing your payment. Please try again later or contact our support team for assistance.</p>
    </div>
  </body>
</html>
