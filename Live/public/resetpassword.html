<!DOCTYPE html>
<html lang="en" >

<head>
  <meta charset="UTF-8">
  <title>::: Cab ::: </title>
  <link href="https://fonts.googleapis.com/css?family=Roboto:400,700"" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="css/style.css">
  <link rel="shortcut icon" href="img/favicon.png">
  <style>
    .errValidation{color:red;}
  </style>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
</head>

<body>
<div id="wrapper-container">    
    <div class="signup-page-bg">
      <div class="signup-foem-wrap">
          <h2 class="signup-title"><span>Reset Your Password</span></h2>
            <div class="signup-card">
              <div class="signup-inner-card">
                  <form class="theme-form">
                    <input type="hidden" id="code" value="">
                    <input type="hidden" id="url" value="">
                    <label class="errValidation" id="lblMessage"></label>                     
                    <div class="form-group">
                      <input type="password" id="password" placeholder="Password" class="signup-form-control">
                      <label class="errValidation" id="lblPassword"></label>
                    </div> 
                    <div class="form-group">
                      <input type="password" id="cpassword" placeholder="Confirm Password" class="signup-form-control">
                      <label class="errValidation" id="lblCPassword"></label>
                    </div>                     
                    <div class="form-button">
                      <button type="button" class="signup-btn-custom" onclick="checkValidation()" id="btnForgotPassword">Reset Password</button>
                    </div> 
                </div>                
            </div>
        </div>
    </div>
  </div>
    
<!-- LogIn form start from here -->
<script type="text/javascript">
    $( document ).ready(function() {
      var url_string = window.location.href; //window.location.href
      var url = new URL(url_string);
      var c = url.searchParams.get("code");
      $('#code').val(c);
      var arr = url_string.split("/");
      var result = arr[0] + "//" + arr[2];
      $('#url').val(result);
    });
    function checkValidation() {
        var password_status=cpassword_status=0;
        var password=$('#password').val();
        var cpassword=$('#cpassword').val();
        var code=$('#code').val();
        var url=$('#url').val();
        if(password==''){
            $('#lblPassword').html("Please enter password.");
            password_status=0;
        }
        else{
            var re = /(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}/;
            if(re.test(password)){
                $('#lblPassword').html("");
                password_status=1;
            }
            else{
                $('#lblPassword').html("Password must be 8 characters long including uppercase , lowercase and symbol.");
                password_status=0;
            }
        }
        if(cpassword==''){
            $('#lblCPassword').html("Please enter confirm password.");
            cpassword_status=0;
            return false;
        }
        else{
            $('#lblCPassword').html("");
            if(password != cpassword){
                $('#lblCPassword').html("Password and Confirm password should be same.");
                cpassword_status=0; 
            }
            else{
                $('#lblCPassword').html("");
                cpassword_status=1;     
            }
        }
        if(password_status==1 && cpassword_status==1){
            $.ajax({
                url:url+"/api/setting/reset-password",
                type:"post",
                data:
                {
                    password:password,
                    cpassword:cpassword,
                    code:code
                },
                success:function(data){
                    if(data =='1'){
                        $('#lblMessage').html('Password has been changed successfully.');
                        $('#lblMessage').fadeIn(1000);
                        setTimeout(function(){ 
                          $('#lblMessage').fadeOut(1000);
                          $('#lblMessage').html('');
                        }, 10000);
                    }
                    else{
                        $('#lblMessage').html('Link already used.');
                        $('#lblMessage').fadeIn(1000);
                        setTimeout(function(){ 
                          $('#lblMessage').fadeOut(1000);
                          $('#lblMessage').html('');
                        }, 10000);
                    }
                }
            });
        }
        else
        {
            return false;
        }
    }

</script>
</body>

</html>
